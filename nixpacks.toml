[phases.setup]
nixPkgs = [
  "php81",
  "php81Extensions.mysqli",       
  "php81Extensions.pdo_mysql",    
  "php81Extensions.pdo",          
  "php81Extensions.mbstring",     
  "php81Extensions.gd",           
  "php81Extensions.curl",         
  "php81Extensions.zip",          
  "composer"
]
providers = ["nixpacks/php"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "php81 -m | grep mysqli || (echo 'CRITICAL: mysqli extension MISSING after Nixpacks!' && php81 --ini | head -20 && exit 1)",
  "php81 -m | grep pdo_mysql || echo 'WARNING: pdo_mysql missing but mysqli OK'",
  "echo '✅ PHP extensions verified - mysqli LOADED'",
  "chmod +x start-container.sh"
]

[start]
cmd = "./start-container.sh"

