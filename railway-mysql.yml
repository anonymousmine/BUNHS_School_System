# Railway MySQL Service Configuration
# This file defines the MySQL service for Railway deployment

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bunhs_db_important
      MYSQL_USER: bunhs_user
      MYSQL_PASSWORD: ${RAILWAY_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${RAILWAY_MYSQL_ROOT_PASSWORD}
    ports:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
